version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 2
    groups:
      # One PR a month for minor and patch updates; majors come as a second grouped PR.
      all-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major-updates:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: npm
    directory: "/console"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 2
    ignore:
      # TypeScript 7 fails the console's check and browser jobs (#90). Lift when we migrate.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR a month for minor and patch updates; majors come as a second grouped PR.
      all-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major-updates:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 2
    groups:
      # One PR a month for minor and patch updates; majors come as a second grouped PR.
      all-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major-updates:
        patterns: ["*"]
        update-types: ["major"]
