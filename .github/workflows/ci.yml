name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      # Fail the build when contract/openapi.yaml drifts from the live API contract.
      - run: npm run contract:check:strict
      # Validate guarded loader/privacy coverage in generated public HTML.
      - run: npm run test:build

  public-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run test:e2e:public
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: public-mobile-traces
          path: test-results/
