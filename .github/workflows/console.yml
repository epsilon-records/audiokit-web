name: Console

# Path-filtered so the console is checked only when it changes. The static site in
# src/ has its own build lifecycle and is not affected by this workflow.
on:
  push:
    branches: [main]
    paths:
      - 'console/**'
      - '.github/workflows/console.yml'
  pull_request:
    paths:
      - 'console/**'
      - '.github/workflows/console.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: console

jobs:
  console:
    name: Install, check, build and test the console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install
        run: npm ci

      - name: Metrics formatting
        run: >-
          npx --no-install prettier --check src/env.ts src/app.d.ts src/hooks.server.ts
          src/routes/+layout.svelte src/routes/api/app-metrics/+server.ts
          src/lib/app-metrics-*.ts src/lib/server/app-metrics-*.ts
          src/lib/components/AppPerformance.svelte tests/app-metrics-*.test.ts
          tests/fixtures/app-metrics-v1.json vite.config.ts

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      # A story that no longer compiles, or that imports something that has moved, fails here
      # (knowledge decision 0064). The Storybook site is built by Netlify from storybook-site/.
      - name: Build Storybook
        run: npm run build-storybook -- --disable-telemetry

      - name: Test
        run: npm test
