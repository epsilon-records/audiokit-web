# The build renders src/ into dist/ and generates the API reference from the OpenAPI contract
# (see scripts/build.mjs for where the contract comes from).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# netlify/functions/submission-created.mjs runs on every verified form submission and emails
# the early-access confirmation (see README, Early-access form).
[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/site.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/docs/openapi.yaml"
  [headers.values]
    Content-Type = "application/yaml; charset=utf-8"

# The site's address is https://audiokit.ai. Send the platform address there too.
# Deploy previews (deploy-preview-N--audiokit.netlify.app) are on other hosts, so they're unaffected.
[[redirects]]
  from = "https://audiokit.netlify.app/*"
  to = "https://audiokit.ai/:splat"
  status = 301
  force = true
