# The audiokit.ai Netlify site builds the SvelteKit app in console/ (AudioKit 0053, EPSILON-169,
# cut-over step C). console/netlify.toml carries the same build and header settings, for whichever
# of the two files Netlify reads once `base` is set; keep them equal (test/netlify-ignore.test.mjs).
#
# `npm run build` runs SvelteKit through @sveltejs/adapter-netlify: the adapter writes the client
# and prerendered assets to build/ and the SSR function to .netlify/functions-internal/.
[build]
  base = "console"
  command = "npm run build"
  publish = "build"
  # Each production deploy costs 15 Free-plan credits: only build when the app (console/), the API
  # contract it reads or this file changes. The paths are repo-root relative (:/ magic), because the
  # command runs in the base directory. An uncached build (refs equal, or either ref missing)
  # always builds. Deploy previews are off (Oracle, knowledge#134: Netlify credits until 14 Dec): a
  # deploy-preview build is skipped unless its branch name ends in -preview.
  # test/netlify-ignore.test.mjs runs this command against a throwaway repo.
  ignore = "{ [ \"$CONTEXT\" = \"deploy-preview\" ] && [ \"${HEAD%-preview}\" = \"$HEAD\" ]; } || { [ -n \"$CACHED_COMMIT_REF\" ] && [ -n \"$COMMIT_REF\" ] && [ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- :/console :/contract :/netlify.toml; }"

[build.environment]
  NODE_VERSION = "22"

# Static assets are served by Netlify, so the app's handle() headers don't apply to them.
# The Content-Security-Policy is set per page by SvelteKit (vite.config.ts), not here.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The contract the API reference is generated from, as the static site served it.
[[headers]]
  for = "/docs/openapi.yaml"
  [headers.values]
    Content-Type = "application/yaml; charset=utf-8"

# The site's address is https://audiokit.ai. Send the platform address there too.
# Deploy previews (deploy-preview-N--audiokit.netlify.app) are on other hosts, so they're unaffected.
[[redirects]]
  from = "https://audiokit.netlify.app/*"
  to = "https://audiokit.ai/:splat"
  status = 301
  force = true
