# The build renders src/ into dist/ and generates the API reference from the OpenAPI contract
# (see scripts/build.mjs for where the contract comes from).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/site.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/docs/openapi.yaml"
  [headers.values]
    Content-Type = "application/yaml; charset=utf-8"
