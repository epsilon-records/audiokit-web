<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<meta name="theme-color" content="#0c0e11" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<!-- Sets data-theme (and data-js) before first paint, so neither theme flashes. -->
		<script src="%sveltekit.assets%/theme-init.js"></script>
		<!-- Space Grotesk and JetBrains Mono are self-hosted (shared 0039, audit F-08). -->
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/space-grotesk-400-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<link rel="stylesheet" href="%sveltekit.assets%/fonts.css" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
