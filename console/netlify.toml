# The console is its own Netlify site. In the Netlify UI set the site's "Base directory"
# to `console` so this file is used; the repo-root netlify.toml belongs to the static site.
#
# `npm run build` runs SvelteKit through @sveltejs/adapter-netlify: the adapter writes the
# client and prerendered assets to build/ and the SSR function to .netlify/functions-internal/.
[build]
  command = "npm run build"
  publish = "build"
  # Each production deploy costs 15 Free-plan credits: only build when the app (this directory)
  # or the API contract it reads changes, not for a change to the static site (EPSILON-169).
  # An uncached build (refs equal, or either ref missing) always builds, as in
  # storybook-site/netlify.toml. test/netlify-ignore.test.mjs runs this command against a
  # throwaway repo.
  # Deploy previews are off (Oracle, knowledge#134: Netlify credits until 14 Dec): a
  # deploy-preview build is skipped unless its branch name ends in -preview.
  ignore = "{ [ \"$CONTEXT\" = \"deploy-preview\" ] && [ \"${HEAD%-preview}\" = \"$HEAD\" ]; } || { [ -n \"$CACHED_COMMIT_REF\" ] && [ -n \"$COMMIT_REF\" ] && [ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../contract; }"

[build.environment]
  NODE_VERSION = "22"

# Static assets are served by Netlify, so the app's handle() headers don't apply to them.
# The Content-Security-Policy is set per page by SvelteKit (vite.config.ts), not here.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The contract the API reference is generated from (EPSILON-169 PR 2), as the static site serves it.
[[headers]]
  for = "/docs/openapi.yaml"
  [headers.values]
    Content-Type = "application/yaml; charset=utf-8"
